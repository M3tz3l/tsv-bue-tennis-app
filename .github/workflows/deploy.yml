
name: Deploy to VPS

on:
  push:
    branches: [ main ]

# One deployment at a time. If several pushes land while a deploy is running, the
# intermediate ones are superseded and the newest commit gets deployed, so a stale
# commit is never deployed after a newer one.
concurrency:
  group: deploy-tsv-tennis-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      run: |
        docker build -t tsv-tennis-app:${{ github.sha }} .
        docker tag tsv-tennis-app:${{ github.sha }} tsv-tennis-app:latest

    - name: Save Docker image
      run: docker save tsv-tennis-app:latest | gzip > tsv-tennis-app.tar.gz

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          # Create deployment directory
          mkdir -p /opt/stacks/tsv-tennis-app
          cd /opt/stacks/tsv-tennis-app
          
          # Stop existing containers
          docker-compose down || true
          
          # Backup current version
          if [ -f "docker-compose.yml" ]; then
            cp docker-compose.yml docker-compose.yml.backup
          fi

    - name: Copy files to VPS
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        source: "compose.yaml,tsv-tennis-app.tar.gz"
        target: "/opt/stacks/tsv-tennis-app/"

    - name: Start new deployment
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          cd /opt/stacks/tsv-tennis-app
          
          # Load new Docker image
          docker load < tsv-tennis-app.tar.gz
          
          # Start services
          docker-compose -f compose.yaml up -d
          
          # Clean up
          rm -f tsv-tennis-app.tar.gz
          
          # Verify deployment
          sleep 10
          docker-compose ps

          echo "Deployment completed successfully!"

    - name: Copy observability stack to VPS
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        source: "observability"
        target: "/opt/stacks/"

    - name: Start observability stack
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          cd /opt/stacks/observability

          # Preserve an existing .env so passwords and retention survive deploys.
          if [ ! -f .env ]; then
            umask 077
            {
              echo "GRAFANA_HOST=grafana.tsv-bue-tennis.de"
              echo "GRAFANA_ADMIN_USER=admin"
              echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 24)"
              echo "LOKI_RETENTION=720h"
            } > .env
            chmod 600 .env
            echo "Generated /opt/stacks/observability/.env with a random Grafana admin password."
            echo "Retrieve it with: sudo cat /opt/stacks/observability/.env"
          fi

          docker-compose -f compose.yaml up -d
          docker-compose -f compose.yaml ps
