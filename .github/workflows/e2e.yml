name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '3 4 * * *'  # Nightly at 04:03 UTC
  workflow_dispatch:
    inputs:
      user_count:
        description: 'Number of test users to create'
        required: false
        default: '20'

# Every E2E run seeds the same shared Teable instance (E2E_TEABLE_* secrets are
# identical across runs) and tears it down again in cleanup.ts. Running two at once
# makes them overwrite each other's members and work hours, so all runs must be
# serialised globally - not just per branch.
#
# Known limitation: a group keeps one active and one pending run, so a third arrival
# cancels the pending one. For pull requests that means the lost run leaves the PR
# without its required E2E check and blocked on merge until re-run ("Re-run all jobs").
# queue: max would fix this, but no released actionlint (through v1.7.12) accepts the
# key and this file is linted in CI, so the Workflow lint job would fail.
#
# The real fix is per-run test-data isolation, which would remove the need to
# serialise E2E at all.
concurrency:
  group: e2e-tsv-tennis-app
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      TEABLE_API_URL: ${{ secrets.E2E_TEABLE_API_URL }}
      TEABLE_TOKEN: ${{ secrets.E2E_TEABLE_TOKEN }}
      MEMBERS_TABLE_ID: ${{ secrets.E2E_MEMBERS_TABLE_ID }}
      WORK_HOURS_TABLE_ID: ${{ secrets.E2E_WORK_HOURS_TABLE_ID }}
      DATABASE_URL: sqlite:./e2e_test.db
      E2E_DATABASE_PATH: ../../backend/e2e_test.db
      JWT_SECRET: e2e-test-secret-do-not-use-in-prod
      EMAIL_DISABLE_SEND: "false"
      EMAIL_ACCEPT_INVALID_CERTS: "true"
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_USER: ""
      EMAIL_PASSWORD: ""
      EMAIL_FROM: e2e-test@tsv-tennis.local
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:5000
      BASE_URL: http://localhost:5173
      # PR: 20 users, Nightly: 110 users
      E2E_USER_COUNT: ${{ github.event_name == 'schedule' && '110' || inputs.user_count || '20' }}
      E2E_ORGA_COUNT: '5'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        # Keep in sync with rust-toolchain.toml, which pins local development.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # One cache entry keyed on all three lockfiles, so the frontend, e2e and
          # e2e/seed installs all reuse the npm cache between runs.
          cache: 'npm'
          cache-dependency-path: |
            tsv-tennis-app/package-lock.json
            e2e/package-lock.json
            e2e/seed/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "backend"

      - name: Build backend
        working-directory: backend
        run: cargo build --release

      - name: Generate TypeScript bindings
        working-directory: backend
        run: cargo run --bin generate-types --release

      - name: Install frontend dependencies
        working-directory: tsv-tennis-app
        run: npm ci

      - name: Copy generated types to frontend
        run: cp backend/bindings/types.ts tsv-tennis-app/src/types/types.ts

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install seed dependencies
        working-directory: e2e/seed
        run: npm ci

      - name: Seed test data
        working-directory: e2e/seed
        env:
          E2E_USER_COUNT: ${{ env.E2E_USER_COUNT }}
          E2E_ORGA_COUNT: ${{ env.E2E_ORGA_COUNT }}
        run: |
          rm -f ../../backend/e2e_test.db
          npx tsx seed.ts

      - name: Start Mailpit (SMTP capture server)
        env:
          # Bump both together; checksum is the digest published by the GitHub release API.
          MAILPIT_VERSION: v1.31.6
          MAILPIT_SHA256: 10fa12ccc610f653d4ed4df848c1817f9935dcf4e9a6a458a19ab0fa02093f91
        run: |
          curl -sL --fail --max-time 120 \
            -o /tmp/mailpit.tar.gz \
            "https://github.com/axllent/mailpit/releases/download/${MAILPIT_VERSION}/mailpit-linux-amd64.tar.gz"
          echo "${MAILPIT_SHA256}  /tmp/mailpit.tar.gz" | sha256sum -c -
          tar xzf /tmp/mailpit.tar.gz -C /tmp
          /tmp/mailpit \
            --smtp-tls-cert sans:localhost \
            --smtp-tls-key sans:localhost \
            --smtp-require-starttls &
          for attempt in $(seq 1 10); do
            if curl -sf --connect-timeout 1 --max-time 5 http://localhost:8025/api/v1/messages > /dev/null; then
              echo "Mailpit ready"
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "Mailpit did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Start backend
        working-directory: backend
        run: |
          ./target/release/tsv-tennis-backend &
          for attempt in $(seq 1 30); do
            if curl -sf --connect-timeout 1 --max-time 5 http://localhost:5000/api/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Backend did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Start frontend dev server
        working-directory: tsv-tennis-app
        run: |
          npm run dev -- --port 5173 &

      - name: Verify servers
        run: |
          curl -sf --connect-timeout 1 --max-time 5 http://localhost:5000/api/health
          for attempt in $(seq 1 30); do
            if curl -sf --connect-timeout 1 --max-time 5 http://localhost:5173 > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Frontend did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test --reporter=list

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ github.event_name }}
          path: |
            e2e/test-results/
            e2e/playwright-report/

      - name: Cleanup Teable test records
        if: always()
        working-directory: e2e/seed
        run: npx tsx cleanup.ts
        continue-on-error: true
