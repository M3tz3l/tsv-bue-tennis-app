name: Rust CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: CI / Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install required system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: backend
      - name: Build
        run: cargo build --workspace --all-targets
        working-directory: backend
      - name: Run tests
        working-directory: backend
        env:
          RUST_TEST_THREADS: 1
        run: cargo test --workspace --all-targets -- --nocapture --test-threads=1
      - name: Generate TypeScript bindings
        working-directory: backend
        run: cargo run --bin generate-types
      - name: Upload generated frontend types
        uses: actions/upload-artifact@v7
        with:
          name: generated-types
          path: backend/bindings/types.ts

  frontend-checks:
    name: CI / Frontend
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Download generated frontend types
        uses: actions/download-artifact@v8
        with:
          name: generated-types
          path: tsv-tennis-app/src/types
      - name: Use Node.js 24.18.1
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
      - name: Install frontend dependencies
        working-directory: tsv-tennis-app
        run: npm ci
      - name: Run Oxlint
        working-directory: tsv-tennis-app
        run: npm run lint
      - name: Run TypeScript typecheck
        working-directory: tsv-tennis-app
        run: npx tsc --noEmit
      - name: Run unit tests
        working-directory: tsv-tennis-app
        run: npm test

  workflow-lint:
    name: CI / Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
