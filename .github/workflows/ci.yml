name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# PR runs share a group per branch so a superseded run gets cancelled.
# Non-PR runs (push to main, schedule, manual) get a unique group so every one of
# them is guaranteed to run: a group keeps at most one *pending* run and cancels
# any earlier pending one, regardless of cancel-in-progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust toolchain
        # Keep in sync with rust-toolchain.toml, which pins local development.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - name: Install required system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: backend
      - name: Build
        run: cargo build --workspace --all-targets
        working-directory: backend
      - name: Run tests
        working-directory: backend
        env:
          RUST_TEST_THREADS: 1
        run: cargo test --workspace --all-targets
      - name: Generate TypeScript bindings
        working-directory: backend
        run: cargo run --bin generate-types
      - name: Upload generated frontend types
        uses: actions/upload-artifact@v7
        with:
          name: generated-types
          path: backend/bindings/types.ts

  frontend-checks:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Download generated frontend types
        uses: actions/download-artifact@v8
        with:
          name: generated-types
          path: tsv-tennis-app/src/types
      - name: Use Node.js 24.18.1
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
      - name: Install frontend dependencies
        working-directory: tsv-tennis-app
        run: npm ci
      - name: Run Oxlint
        working-directory: tsv-tennis-app
        run: npm run lint
      - name: Run TypeScript typecheck
        working-directory: tsv-tennis-app
        run: npx tsc --noEmit
      - name: Run unit tests
        working-directory: tsv-tennis-app
        run: npm test

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check workflow files
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  status-check:
    name: Status check
    if: always()
    needs:
      - test
      - frontend-checks
      - workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: suzuki-shunsuke/required-status-check-action@2b5a46064846b09381852c2c4217e898f639e768 # v0.1.3
        with:
          needs: ${{ toJson(needs) }}
